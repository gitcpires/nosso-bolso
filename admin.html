<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Bolso - Painel do Administrador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen p-4">

  <header class="max-w-4xl mx-auto flex items-center justify-between pb-6 border-b border-slate-800 mb-6">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 text-white p-2.5 rounded-2xl shadow-lg">
        <i class="fa-solid fa-shield-halved text-lg"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-xl text-white">Gestão de Acessos</h1>
        <p class="text-xs text-slate-400">Aprove ou recuse solicitações de novos membros</p>
      </div>
    </div>
    
    <a href="painel.html" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2">
      <i class="fa-solid fa-arrow-left"></i> Voltar ao Painel
    </a>
  </header>

  <main class="max-w-4xl mx-auto space-y-4">
    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Solicitações Pendentes</h2>

    <div id="lista-solicitacoes" class="space-y-3">
      <!-- Os pedidos aparecerão aqui dinamicamente -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center text-slate-400 text-sm">
        A carregar solicitações...
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
      authDomain: "nosso-bolso-c8d29.firebaseapp.com",
      projectId: "nosso-bolso-c8d29",
      storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
      messagingSenderId: "812166717623",
      appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function carregarSolicitacoes() {
      const container = document.getElementById('lista-solicitacoes');
      try {
        const snapshot = await db.collection('solicitacoes').where('status', '==', 'pendente').get();
        
        if (snapshot.empty) {
          container.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center text-slate-400 text-sm">Nenhuma solicitação pendente no momento.</div>`;
          return;
        }

        container.innerHTML = '';
        snapshot.forEach(doc => {
          const dados = doc.data();
          const uid = doc.id;

          container.innerHTML += `
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
              <div>
                <p class="text-sm font-bold text-white">${dados.email}</p>
                <span class="text-xs text-slate-400">Solicitado em: ${new Date(dados.criadoEm).toLocaleDateString()}</span>
              </div>
              <div class="flex gap-2">
                <button onclick="aprovarUsuario('${uid}', '${dados.email}')" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                  Aprovar
                </button>
                <button onclick="recusarUsuario('${uid}')" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                  Recusar
                </button>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="bg-rose-900/20 border border-rose-800 p-4 rounded-2xl text-center text-rose-400 text-sm">Erro ao carregar solicitações.</div>`;
      }
    }

    async function aprovarUsuario(uid, email) {
      try {
        // Move para a coleção de usuários aprovados
        await db.collection('usuarios').doc(uid).set({
          email: email,
          status: 'membro'
        });
        // Remove da coleção de solicitações
        await db.collection('solicitacoes').doc(uid).delete();
        alert('Utilizador aprovado com sucesso!');
        carregarSolicitacoes();
      } catch (err) {
        alert('Erro ao aprovar utilizador.');
      }
    }

    async function recusarUsuario(uid) {
      try {
        await db.collection('solicitacoes').doc(uid).delete();
        alert('Solicitação recusada.');
        carregarSolicitacoes();
      } catch (err) {
        alert('Erro ao recusar.');
      }
    }

    carregarSolicitacoes();
  </script>
</body>
</html>
