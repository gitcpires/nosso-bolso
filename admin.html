<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Bolso - Painel do Administrador</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Cabeçalho -->
    <div class="flex items-center justify-between bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-md">
      <div>
        <h1 class="text-lg font-black text-white"><i class="fa-solid fa-shield-halved text-amber-400 mr-2"></i>Painel Administrativo</h1>
        <p class="text-xs text-slate-400">Gestão de acessos e utilizadores</p>
      </div>
      <button onclick="logout()" class="bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white px-3 py-2 rounded-xl text-xs font-extrabold transition">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> Sair
      </button>
    </div>

    <!-- Lista de Utilizadores -->
    <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-md space-y-4">
      <h2 class="text-sm font-extrabold text-white">Utilizadores Registados</h2>
      <div id="usersListContainer" class="space-y-2">
        <div class="text-xs text-slate-400 text-center py-4">A carregar utilizadores...</div>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
      authDomain: "nosso-bolso-c8d29.firebaseapp.com",
      projectId: "nosso-bolso-c8d29",
      storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
      messagingSenderId: "812166717623",
      appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let verificado = false;

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        console.log("Nenhum utilizador logado. A redirecionar para index.html");
        window.location.replace("index.html");
        return;
      }

      if (verificado) return;
      verificado = true;

      console.log("Utilizador autenticado:", user.uid);
      
      try {
        const adminDoc = await db.collection('ADMIN_UID').doc(user.uid).get();

        if (!adminDoc.exists) {
          console.warn("UID não encontrado na coleção ADMIN_UID. A redirecionar para painel.html");
          window.location.replace("painel.html");
          return;
        }

        console.log("Admin verificado com sucesso. A iniciar painel...");
        iniciarPainelAdmin();
      } catch (err) {
        console.error("Erro crítico ao validar admin:", err);
      }
    });

    function iniciarPainelAdmin() {
      db.collection('users').onSnapshot((snapshot) => {
        const container = document.getElementById('usersListContainer');
        if (!container) return;
        
        container.innerHTML = '';
        if (snapshot.empty) {
          container.innerHTML = `<div class="text-xs text-slate-400 text-center py-4">Nenhum utilizador encontrado na base de dados.</div>`;
          return;
        }

        snapshot.forEach(doc => {
          const u = doc.data();
          const uid = doc.id;
          const isPending = u.status === 'pending';

          container.innerHTML += `
            <div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
              <div>
                <div class="text-xs font-bold text-white">${u.email || 'E-mail não disponível'}</div>
                <div class="text-[10px] text-slate-400">Estado: <span class="${isPending ? 'text-amber-400' : 'text-emerald-400'} font-extrabold">${u.status || 'ativo'}</span></div>
              </div>
              <div class="flex items-center gap-2">
                ${isPending ? `<button onclick="aprovarUtilizador('${uid}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg text-[10px] font-bold transition">Aprovar</button>` : ''}
                <button onclick="removerUtilizador('${uid}')" class="text-slate-500 hover:text-rose-400 p-1 transition" title="Remover utilizador"><i class="fa-solid fa-trash text-xs"></i></button>
              </div>
            </div>
          `;
        });
      }, (error) => {
        console.error("Erro no onSnapshot da coleção users:", error);
        document.getElementById('usersListContainer').innerHTML = `<div class="text-xs text-rose-400 text-center py-4">Erro ao carregar utilizadores. Verifique as regras do Firestore.</div>`;
      });
    }

    async function aprovarUtilizador(uid) {
      try {
        await db.collection('users').doc(uid).update({ status: 'approved' });
      } catch (err) {
        alert("Erro ao aprovar utilizador.");
      }
    }

    async function removerUtilizador(uid) {
      if (confirm("Deseja realmente remover este utilizador?")) {
        try {
          await db.collection('users').doc(uid).delete();
        } catch (err) {
          alert("Erro ao remover utilizador.");
        }
      }
    }

    function logout() {
      auth.signOut().then(() => window.location.replace('index.html'));
    }
  </script>
</body>
</html>
