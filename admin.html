<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Chefe - Nosso Bolso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 font-sans">
  <div class="max-w-md mx-auto">
    
    <div class="text-center mb-8">
      <h1 class="text-2xl font-black text-amber-500">Administração</h1>
      <p class="text-sm text-slate-400">Controle total de acessos</p>
    </div>

    <div id="login-section" class="bg-slate-800 p-6 rounded-3xl border border-slate-700">
      <input type="email" id="admin-email" placeholder="Seu e-mail VIP" class="w-full mb-3 rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm focus:outline-none focus:border-amber-500" />
      <input type="password" id="admin-senha" placeholder="Senha" class="w-full mb-4 rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm focus:outline-none focus:border-amber-500" />
      <button onclick="loginAdmin()" class="w-full bg-amber-600 hover:bg-amber-700 font-bold py-3 rounded-xl">Entrar no Painel</button>
      <div id="msg-login" class="mt-4 text-center text-sm font-semibold text-rose-400 hidden"></div>
    </div>

    <div id="painel-section" class="hidden space-y-8">
      
      <div>
        <h2 class="text-lg font-bold text-amber-400 mb-3 flex items-center justify-between">
          Aguardando Aprovação
          <button onclick="carregarUsuarios()" class="text-xs bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">Atualizar</button>
        </h2>
        <div id="lista-pendentes" class="space-y-3"></div>
      </div>

      <hr class="border-slate-700">

      <div>
        <h2 class="text-lg font-bold text-emerald-400 mb-3">Usuários Ativos</h2>
        <div id="lista-aprovados" class="space-y-3"></div>
      </div>

    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
      authDomain: "nosso-bolso-c8d29.firebaseapp.com",
      projectId: "nosso-bolso-c8d29"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    let authToken = "";

    async function loginAdmin() {
      const msg = document.getElementById('msg-login');
      try {
        msg.classList.remove('hidden'); msg.innerText = "Autenticando...";
        const userCred = await auth.signInWithEmailAndPassword(document.getElementById('admin-email').value, document.getElementById('admin-senha').value);
        authToken = await userCred.user.getIdToken();
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('painel-section').classList.remove('hidden');
        carregarUsuarios();
      } catch (error) {
        msg.innerText = "Acesso negado.";
      }
    }

    async function carregarUsuarios() {
      const divPendentes = document.getElementById('lista-pendentes');
      const divAprovados = document.getElementById('lista-aprovados');
      
      divPendentes.innerHTML = "<p class='text-xs text-slate-500'>Carregando...</p>";
      divAprovados.innerHTML = "<p class='text-xs text-slate-500'>Carregando...</p>";

      try {
        const res = await fetch('/.netlify/functions/admin', { headers: { 'Authorization': 'Bearer ' + authToken } });
        const usuarios = await res.json();
        
        const pendentes = usuarios.filter(u => u.status === 'pendente');
        const aprovados = usuarios.filter(u => u.status === 'aprovado');

        if (pendentes.length === 0) divPendentes.innerHTML = "<p class='text-xs text-slate-500 bg-slate-800/50 p-3 rounded-xl border border-slate-700/50'>Ninguém na fila.</p>";
        else {
          divPendentes.innerHTML = pendentes.map(u => `
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl" id="user-${u.id}">
              <p class="text-sm font-bold truncate">${u.email}</p>
              <div class="flex gap-2 mt-3">
                <button onclick="acaoUsuario('${u.id}', 'POST')" class="flex-1 bg-emerald-600/20 text-emerald-400 border border-emerald-800 text-xs font-bold py-2 rounded-lg">Aprovar</button>
                <button onclick="acaoUsuario('${u.id}', 'DELETE')" class="flex-1 bg-rose-600/20 text-rose-400 border border-rose-800 text-xs font-bold py-2 rounded-lg">Recusar</button>
              </div>
            </div>
          `).join('');
        }

        if (aprovados.length === 0) divAprovados.innerHTML = "<p class='text-xs text-slate-500 bg-slate-800/50 p-3 rounded-xl border border-slate-700/50'>Nenhum usuário ativo.</p>";
        else {
          divAprovados.innerHTML = aprovados.map(u => {
            const grupoTexto = u.grupoId ? `Grupo: ${u.grupoId}` : "Sem grupo (Aguardando escolha)";
            return `
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-center" id="user-${u.id}">
              <div class="truncate pr-4">
                <p class="text-sm font-bold truncate">${u.email}</p>
                <p class="text-xs text-amber-500 mt-0.5">${grupoTexto}</p>
              </div>
              <button onclick="acaoUsuario('${u.id}', 'DELETE')" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold py-2 px-3 rounded-lg shrink-0">Excluir</button>
            </div>
          `}).join('');
        }
      } catch (error) {
        divPendentes.innerHTML = `<p class='text-rose-400 text-xs'>Erro: ${error.message}</p>`;
      }
    }

    async function acaoUsuario(userId, metodo) {
      if (metodo === 'DELETE' && !confirm("Tem certeza que deseja apagar esta conta permanentemente?")) return;
      
      const card = document.getElementById(`user-${userId}`);
      card.style.opacity = "0.5";

      try {
        await fetch('/.netlify/functions/admin', {
          method: metodo,
          headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: userId })
        });
        carregarUsuarios(); 
      } catch (error) {
        alert("Falha ao processar.");
        card.style.opacity = "1";
      }
    }
  </script>
</body>
</html>
