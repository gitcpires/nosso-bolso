<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Bolso - Painel do Administrador</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Cabeçalho -->
    <div class="flex items-center justify-between bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-md">
      <div>
        <h1 class="text-lg font-black text-white"><i class="fa-solid fa-shield-halved text-amber-400 mr-2"></i>Painel Administrativo</h1>
        <p class="text-xs text-slate-400">Gestão de acessos e utilizadores</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="limparDesabilitados()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-xl text-xs font-bold transition">
          <i class="fa-solid fa-broom mr-1"></i> Limpar Desabilitados
        </button>
        <button onclick="logout()" class="bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white px-3 py-2 rounded-xl text-xs font-extrabold transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Sair
        </button>
      </div>
    </div>

    <!-- Lista de Utilizadores -->
    <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-md space-y-4">
      <h2 class="text-sm font-extrabold text-white">Utilizadores Registados</h2>
      <div id="usersListContainer" class="space-y-2">
        <div class="text-xs text-slate-400 text-center py-4">A carregar utilizadores...</div>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
      authDomain: "nosso-bolso-c8d29.firebaseapp.com",
      projectId: "nosso-bolso-c8d29",
      storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
      messagingSenderId: "812166717623",
      appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.replace("index.html");
        return;
      }
      
      const adminDoc = await db.collection('ADMIN_UID').doc(user.uid).get();

      if (!adminDoc.exists) {
        window.location.replace("painel.html");
        return;
      }

      ouvinteDadosAdmin();
    });

    function ouvinteDadosAdmin() {
      db.collection('users').onSnapshot((snapshot) => {
        const container = document.getElementById('usersListContainer');
        if (!container) return;
        
        container.innerHTML = '';
        if (snapshot.empty) {
          container.innerHTML = `<div class="text-xs text-slate-400 text-center py-4">Nenhum utilizador encontrado.</div>`;
          return;
        }

        snapshot.forEach(doc => {
          const u = doc.data();
          const uid = doc.id;
          const isPending = u.status === 'pending';
          const isDisabled = u.status === 'disabled';

          // Define a cor e o texto do estado
          let statusBadge = '<span class="text-emerald-400 font-extrabold">ativo</span>';
          if (isPending) statusBadge = '<span class="text-amber-400 font-extrabold">pendente</span>';
          if (isDisabled) statusBadge = '<span class="text-rose-500 font-extrabold">desabilitado</span>';

          container.innerHTML += `
            <div class="flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-700 ${isDisabled ? 'opacity-60' : ''}">
              <div>
                <div class="text-xs font-bold text-white">${u.email}</div>
                <div class="text-[10px] text-slate-400">Estado: ${statusBadge}</div>
              </div>
              <div class="flex items-center gap-2">
                ${isPending ? `<button onclick="aprovarUtilizador('${uid}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg text-[10px] font-bold transition">Aprovar</button>` : ''}
                
                ${!isDisabled ? `
                  <button onclick="desabilitarUtilizador('${uid}')" title="Desabilitar acesso" class="text-slate-400 hover:text-amber-400 p-1 transition">
                    <i class="fa-solid fa-ban text-xs"></i>
                  </button>
                ` : `
                  <span class="text-[10px] text-slate-500 italic">Inativo</span>
                `}

                <button onclick="removerUtilizadorDireto('${uid}')" title="Eliminar do registo" class="text-slate-500 hover:text-rose-400 p-1 transition">
                  <i class="fa-solid fa-trash text-xs"></i>
                </button>
              </div>
            </div>
          `;
        });
      });
    }

    async function aprovarUtilizador(uid) {
      try {
        await db.collection('users').doc(uid).update({ status: 'approved' });
      } catch (err) {
        alert("Erro ao aprovar utilizador.");
      }
    }

    // Apenas marca o utilizador como desabilitado (bloqueia o acesso de imediato)
    async function desabilitarUtilizador(uid) {
      if (confirm("Tens a certeza que pretendes desabilitar este utilizador?")) {
        try {
          await db.collection('users').doc(uid).update({ status: 'disabled' });
        } catch (err) {
          alert("Erro ao desabilitar utilizador.");
        }
      }
    }

    // Elimina permanentemente um utilizador específico
    async function removerUtilizadorDireto(uid) {
      if (confirm("Deseja eliminar este registo permanentemente da base de dados?")) {
        try {
          await db.collection('users').doc(uid).delete();
        } catch (err) {
          alert("Erro ao remover utilizador.");
        }
      }
    }

    // Botão do cabeçalho que varre a base e apaga todos os que estão com estado 'disabled' de uma só vez
    async function limparDesabilitados() {
      if (confirm("Deseja eliminar permanentemente todos os utilizadores marcados como desabilitados?")) {
        try {
          const snapshot = await db.collection('users').where('status', '==', 'disabled').get();
          if (snapshot.empty) {
            alert("Não existem utilizadores desabilitados para limpar.");
            return;
          }

          const batch = db.batch();
          snapshot.forEach(doc => {
            batch.delete(doc.ref);
          });

          await batch.commit();
          alert("Lista de desabilitados limpa com sucesso!");
        } catch (err) {
          console.error(err);
          alert("Erro ao limpar utilizadores desabilitados.");
        }
      }
    }

    function logout() {
      auth.signOut().then(() => window.location.replace('index.html'));
    }
  </script>
</body>
</html>
