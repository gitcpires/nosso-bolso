<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nosso Bolso - Painel Financeiro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .glass-nav { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-900 pb-36 antialiased selection:bg-blue-600 selection:text-white">

  <!-- TELA DE BLOQUEIO / AGUARDANDO APROVAÇÃO (Fica oculta até verificar o status) -->
  <div id="pendingScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/90 p-4 hidden backdrop-blur-md">
    <div class="w-full max-w-md bg-white p-8 rounded-[2.5rem] shadow-2xl text-center space-y-4">
      <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-2xl">
        <i class="fa-solid fa-clock-rotate-left"></i>
      </div>
      <h2 class="text-xl font-black text-slate-900">Aguardando Aprovação</h2>
      <p class="text-xs text-slate-500 leading-relaxed">
        Sua conta foi criada com sucesso, mas o acesso ao painel financeiro requer ativação pelo administrador. Entre em contato para liberar o seu acesso.
      </p>
      <button onclick="logout()" class="w-full py-3 bg-slate-900 text-white rounded-2xl text-xs font-extrabold hover:bg-slate-800 transition">
        Sair da Conta
      </button>
    </div>
  </div>

  <!-- CABEÇALHO -->
  <header class="sticky top-0 z-40 w-full border-b border-slate-200/90 glass-nav px-3.5 py-2.5 shadow-xs">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white shadow-sm">
          <i class="fa-solid fa-wallet text-sm"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 leading-tight">
            <span class="text-sm font-extrabold tracking-tight text-slate-900 truncate">Nosso Bolso</span>
            <span class="rounded-full bg-blue-100 px-2 py-0.5 text-[9px] font-extrabold text-blue-700">Outubro 2026</span>
          </div>
          <div class="flex items-center gap-1 leading-tight mt-0.5">
            <span class="h-2 w-2 rounded-full bg-emerald-500 inline-block"></span>
            <p class="text-[10px] text-slate-500 font-semibold truncate" id="headerWelcomeMsg">Conectado</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <!-- BOTÃO ADM EXCLUSIVO -->
        <button id="adminBtn" onclick="window.location.href='admin.html'" title="ADM" class="hidden h-8.5 items-center gap-1.5 rounded-xl border border-blue-200 bg-blue-50 px-2.5 text-xs font-bold text-blue-700 hover:bg-blue-100 transition">
          <i class="fa-solid fa-shield-halved text-xs"></i> ADM
        </button>

        <button onclick="logout()" class="flex h-8.5 w-8.5 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-500 hover:bg-slate-100 transition">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-3.5 pt-6 text-center">
    <div class="p-8 bg-white rounded-3xl border border-slate-200 shadow-2xs">
      <h2 class="text-lg font-extrabold text-slate-800">Painel Liberado com Sucesso!</h2>
      <p class="text-xs text-slate-400 mt-1">Sua conta está ativa e pronta para uso.</p>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
      authDomain: "nosso-bolso-c8d29.firebaseapp.com",
      projectId: "nosso-bolso-c8d29",
      storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
      messagingSenderId: "812166717623",
      appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(async (userAuth) => {
      if (!userAuth) {
        window.location.href = 'index.html';
        return;
      }

      const uid = userAuth.uid;
      const email = userAuth.email;

      // Blindagem ADM
      if (email === 'c.pirespm@gmail.com') {
        document.getElementById('adminBtn').style.display = 'flex';
        return; // ADM entra direto sem bloqueios
      }

      // Verifica no banco de dados se o utilizador foi aprovado
      const userDoc = await db.collection('users').doc(uid).get();
      if (userDoc.exists) {
        const userData = userDoc.data();
        if (userData.status !== 'approved') {
          // Se não estiver aprovado, mostra a tela de pendente e bloqueia o painel
          document.getElementById('pendingScreen').classList.remove('hidden');
        }
      } else {
        document.getElementById('pendingScreen').classList.remove('hidden');
      }
    });

    function logout() {
      auth.signOut().then(() => window.location.href = 'index.html');
    }
  </script>
</body>
</html>
