  <!-- Modal de Configurações Compacto e Moderno -->
  <div id="profileModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4 hidden backdrop-blur-md">
    <div class="w-full max-w-sm bg-white p-4 rounded-[2rem] space-y-3 shadow-2xl max-h-[90vh] overflow-y-auto">
      
      <!-- Cabeçalho do Modal -->
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xs">
            <i class="fa-solid fa-gear"></i>
          </div>
          <h3 class="text-xs font-black text-slate-900 uppercase tracking-wider">Configurações do Grupo</h3>
        </div>
        <button onclick="closeProfileModal()" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark text-xs"></i></button>
      </div>

      <!-- Código de Convite Compacto (Linha Única) -->
      <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-200 flex items-center justify-between">
        <div>
          <span class="text-[9px] font-bold text-slate-400 uppercase tracking-tight block">Código de Convite</span>
          <div id="profileWorkspaceCodeDisplay" class="text-base font-black text-blue-600 tracking-widest">----</div>
        </div>
        <button onclick="copyWorkspaceCountCode()" class="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-[10px] font-extrabold transition shadow-xs flex items-center gap-1">
          <i class="fa-solid fa-copy"></i> Copiar
        </button>
      </div>

      <!-- Secção de Metas Compacta -->
      <div class="bg-blue-50/40 p-3 rounded-2xl border border-blue-100 space-y-2">
        <div class="flex items-center justify-between">
          <h4 class="text-[11px] font-extrabold text-blue-900 uppercase">Definir Metas</h4>
          <div class="flex bg-white p-0.5 rounded-lg border border-slate-200 shadow-2xs">
            <button type="button" onclick="mudarModoMetas('perc')" id="btnModoPerc" class="px-2 py-0.5 text-[10px] font-bold rounded-md bg-blue-600 text-white transition">%</button>
            <button type="button" onclick="mudarModoMetas('dinheiro')" id="btnModoDinheiro" class="px-2 py-0.5 text-[10px] font-bold rounded-md text-slate-600 transition">R$</button>
          </div>
        </div>

        <form onsubmit="salvarMetasGrupoConfig(event)" class="space-y-2">
          <div class="grid grid-cols-2 gap-1.5">
            <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs space-y-0.5">
              <label class="block text-[9px] font-bold text-slate-500">Fixos (<span id="labelUnidadeFixos">%</span>)</label>
              <input type="number" step="0.01" id="cfgMetaFixos" required oninput="calcularConversaoMetas('fixos')" class="w-full bg-slate-50 rounded-lg border border-slate-200 px-2 py-1 text-xs font-extrabold text-center" />
              <span id="subMetaFixos" class="text-[8px] text-slate-400 block text-center truncate">--</span>
            </div>
            <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs space-y-0.5">
              <label class="block text-[9px] font-bold text-slate-500">Gerais (<span id="labelUnidadeGerais">%</span>)</label>
              <input type="number" step="0.01" id="cfgMetaGerais" required oninput="calcularConversaoMetas('gerais')" class="w-full bg-slate-50 rounded-lg border border-slate-200 px-2 py-1 text-xs font-extrabold text-center" />
              <span id="subMetaGerais" class="text-[8px] text-slate-400 block text-center truncate">--</span>
            </div>
            <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs space-y-0.5">
              <label class="block text-[9px] font-bold text-slate-500">Lazer (<span id="labelUnidadeLazer">%</span>)</label>
              <input type="number" step="0.01" id="cfgMetaLazer" required oninput="calcularConversaoMetas('lazer')" class="w-full bg-slate-50 rounded-lg border border-slate-200 px-2 py-1 text-xs font-extrabold text-center" />
              <span id="subMetaLazer" class="text-[8px] text-slate-400 block text-center truncate">--</span>
            </div>
            <div class="bg-white p-2 rounded-xl border border-slate-200 shadow-2xs space-y-0.5">
              <label class="block text-[9px] font-bold text-slate-500">Invest. (<span id="labelUnidadeInvest">%</span>)</label>
              <input type="number" step="0.01" id="cfgMetaInvest" required oninput="calcularConversaoMetas('invest')" class="w-full bg-slate-50 rounded-lg border border-slate-200 px-2 py-1 text-xs font-extrabold text-center" />
              <span id="subMetaInvest" class="text-[8px] text-slate-400 block text-center truncate">--</span>
            </div>
          </div>

          <!-- Indicador de Soma Total das Metas -->
          <div class="text-center">
            <span id="metaTotalRestante" class="text-[10px] font-bold text-slate-500"></span>
          </div>

          <div id="metaConfigErrorMsg" class="text-[10px] font-bold text-rose-600 bg-rose-50 p-1 rounded-xl text-center hidden"></div>

          <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-[11px] font-extrabold transition shadow-sm">
            Guardar Novas Metas
          </button>
        </form>
      </div>

      <!-- Membros do Grupo (Mais Compacto) -->
      <div class="space-y-1">
        <span class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider block">Membros do Grupo</span>
        <div id="workspaceMembersList" class="space-y-1 max-h-20 overflow-y-auto pr-1"></div>
      </div>

      <!-- Botões Inferiores (Sair / Terminar Sessão) -->
      <div class="pt-2 border-t border-slate-100 flex gap-2">
        <button onclick="deixarGrupo()" class="w-1/2 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-xl text-[11px] font-bold transition">
          Sair do Grupo
        </button>
        <button onclick="logout()" class="w-1/2 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-[11px] font-bold transition">
          Terminar Sessão
        </button>
      </div>
    </div>
  </div>
