<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nosso Bolso - Painel Financeiro</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Chart.js para os Gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .glass-nav {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    
    .fab-center {
      position: absolute;
      left: 50%;
      top: -22px;
      transform: translateX(-50%);
    }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-900 pb-36 antialiased selection:bg-blue-600 selection:text-white">

  <!-- ================= CABEÇALHO DO PAINEL ================= -->
  <header class="sticky top-0 z-40 w-full border-b border-slate-200/90 glass-nav px-3.5 py-2.5 shadow-xs transition-all">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-2">
      
      <div class="flex items-center gap-2 min-w-0">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white shadow-sm">
          <i class="fa-solid fa-wallet text-sm"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 leading-tight">
            <span class="text-sm font-extrabold tracking-tight text-slate-900 truncate" id="topWorkspaceTitle">Nosso Bolso</span>
            <span id="currentMonthBadge" class="shrink-0 rounded-full bg-blue-100 px-2 py-0.5 text-[9px] font-extrabold text-blue-700">Outubro 2026</span>
          </div>
          <div class="flex items-center gap-1 leading-tight mt-0.5">
            <span class="h-2 w-2 rounded-full bg-emerald-500 inline-block"></span>
            <p class="text-[10px] text-slate-500 font-semibold truncate" id="headerWelcomeMsg">Conectado</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <!-- BOTÃO DO ADM: Oculto por defeito, aparece apenas para c.pirespm@gmail.com -->
        <button id="adminBtn" onclick="window.location.href='admin.html'" title="Painel Exclusivo ADM" class="hidden h-8.5 items-center gap-1.5 rounded-xl border border-blue-200 bg-blue-50 px-2.5 text-xs font-bold text-blue-700 shadow-2xs hover:bg-blue-100 active:scale-95 transition">
          <i class="fa-solid fa-shield-halved text-blue-600 text-xs"></i>
          <span class="text-xs">ADM</span>
        </button>

        <!-- Configurações / Perfil -->
        <button onclick="openProfileModal()" title="Configurações & Código" class="flex h-8.5 items-center gap-1.5 rounded-xl px-2.5 text-xs font-bold transition shadow-2xs bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200 active:scale-95">
          <span id="headerUserEmoji" class="text-xs">👤</span>
          <span id="headerUserName" class="text-xs font-extrabold max-w-[85px] truncate">Usuário</span>
          <i class="fa-solid fa-gear text-[10px] text-slate-500 ml-0.5"></i>
        </button>

        <!-- Botão Sair -->
        <button onclick="logout()" title="Sair da conta" class="flex h-8.5 w-8.5 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-500 hover:text-slate-800 hover:bg-slate-100 active:scale-95 transition">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
        </button>
