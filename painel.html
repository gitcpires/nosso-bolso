<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nosso Bolso - Painel Financeiro</title>

  <!-- Ícone e Configuração de Atalho para Telemóvel -->
  <link rel="apple-touch-icon" sizes="180x180" href="icone-app.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icone-app.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icone-app.png">
  <meta name="theme-color" content="#090d16">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .fonte-manuscrita { font-family: 'Caveat', cursive; }
    .papel-mural {
      background-image: url('papel.jpg?v=2');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 pb-28 antialiased selection:bg-blue-600 selection:text-white transition-colors duration-200">

  <!-- Ecrã de Carregamento -->
  <div id="loadingScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 text-white space-y-4">
    <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-xs font-bold tracking-wider">A carregar o seu Nosso Bolso...</p>
  </div>

  <!-- Ecrã de Pendente -->
  <div id="pendingScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4 hidden">
    <div class="w-full max-w-sm bg-white dark:bg-slate-900 p-8 rounded-[2.5rem] text-center space-y-4 shadow-2xl">
      <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-2xl flex items-center justify-center mx-auto text-2xl">
        <i class="fa-solid fa-clock-rotate-left"></i>
      </div>
      <h3 class="text-base font-extrabold text-slate-900 dark:text-white">Acesso Pendente</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">A sua conta foi criada mas ainda precisa de ser aprovada pelo administrador do sistema.</p>
      <button onclick="logout()" class="w-full py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-2xl text-xs font-bold transition">
        Sair / Voltar ao Login
      </button>
    </div>
  </div>

  <!-- Modal de Configuração / Criação de Grupo -->
  <div id="setupWorkspaceModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4 hidden backdrop-blur-md">
    <div class="w-full max-w-sm bg-white dark:bg-slate-900 p-6 rounded-[2.5rem] space-y-6 shadow-2xl">
      <div class="text-center space-y-2">
        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto text-xl">
          <i class="fa-solid fa-house-user"></i>
        </div>
        <h3 class="text-base font-extrabold text-slate-900 dark:text-white">Configure o seu Espaço</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400">Como deseja iniciar o seu controle financeiro?</p>
      </div>

      <div class="space-y-3">
        <button onclick="criarNovoWorkspace()" class="w-full p-4 rounded-2xl border-2 border-blue-500/35 hover:border-blue-600 bg-blue-50/40 dark:bg-slate-800 hover:bg-blue-50 text-left transition space-y-1 group">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold text-blue-900 dark:text-blue-400">Criar um Novo Grupo</span>
            <i class="fa-solid fa-circle-plus text-blue-600"></i>
          </div>
          <p class="text-[10px] text-slate-500 dark:text-slate-400">Gerar um novo espaço exclusivo e código próprio.</p>
        </button>

        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
          <span class="flex-shrink mx-4 text-[10px] text-slate-400 font-bold uppercase">ou</span>
          <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
        </div>

        <div class="p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3 bg-slate-50/50 dark:bg-slate-800/50">
          <span class="text-xs font-extrabold text-slate-800 dark:text-slate-200 block">Entrar com Código de Convite</span>
          <div class="flex gap-2">
            <input type="text" id="inputWorkspaceCode" maxlength="4" placeholder="Ex: 8660" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2.5 text-xs font-bold tracking-widest text-center dark:text-white focus:outline-none focus:border-blue-600" />
            <button onclick="entrarGrupoExistente()" class="bg-slate-900 dark:bg-blue-600 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition">Entrar</button>
          </div>
        </div>
