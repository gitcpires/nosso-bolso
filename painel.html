<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Bolso - Painel Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen pb-12">

  <!-- Cabeçalho Moderno / Barra Superior -->
  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-4 py-3.5 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 text-white p-2.5 rounded-2xl shadow-lg shadow-blue-600/30">
        <i class="fa-solid fa-wallet text-lg"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-lg text-white leading-tight">Nosso Bolso</h1>
        <span class="text-xs text-slate-400 flex items-center gap-1">
          <i class="fa-solid fa-users text-[10px] text-blue-400"></i> Grupo: <span id="grupo-id" class="text-slate-200 font-medium">8660</span>
        </span>
      </div>
    </div>
    
    <button onclick="sairSistema()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
    </button>
  </header>

  <!-- Container Principal Responsivo -->
  <main class="max-w-4xl mx-auto p-4 space-y-6 mt-2">

    <!-- Resumo de Saldos / Cartão de Destaque -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-gradient-to-br from-blue-900/40 to-slate-900 border border-blue-500/20 p-5 rounded-3xl shadow-xl">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-bold text-blue-400 uppercase tracking-wider">Saldo Atual</span>
          <i class="fa-solid fa-chart-line text-blue-400"></i>
        </div>
        <div class="text-2xl font-black text-white" id="saldo-atual">R$ 0,00</div>
      </div>
      
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-3xl shadow-xl">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Entradas do Mês</span>
          <i class="fa-solid fa-arrow-trend-up text-emerald-400"></i>
        </div>
        <div class="text-2xl font-black text-emerald-400" id="total-entradas">R$ 0,00</div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-5 rounded-3xl shadow-xl">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-bold text-rose-400 uppercase tracking-wider">Saídas do Mês</span>
          <i class="fa-solid fa-arrow-trend-down text-rose-400"></i>
        </div>
        <div class="text-2xl font-black text-rose-400" id="total-saidas">R$ 0,00</div>
      </div>
    </section>

    <!-- Formulário Moderno de Novo Lançamento -->
    <section class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
      <div class="flex items-center space-x-3 mb-6">
        <div class="bg-blue-500/10 text-blue-400 p-2.5 rounded-xl border border-blue-500/20">
          <i class="fa-solid fa-plus text-base"></i>
        </div>
        <div>
          <h2 class="text-lg font-bold text-white">Novo Lançamento</h2>
          <p class="text-xs text-slate-400">Registe uma nova receita ou despesa no cofre</p>
        </div>
      </div>

      <form id="transacao-form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Tipo -->
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wide">Tipo</label>
            <div class="relative">
              <select id="tipo" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white appearance-none focus:outline-none focus:border-blue-500 transition">
                <option value="despesa">Despesa (Saída)</option>
                <option value="receita">Receita (Entrada)</option>
              </select>
              <i class="fa-solid fa-chevron-down absolute right-4 top-3.5 text-xs text-slate-500 pointer-events-none"></i>
            </div>
          </div>

          <!-- Valor -->
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wide">Valor (R$)</label>
            <div class="relative">
              <span class="absolute left-4 top-3 text-sm text-slate-500 font-semibold">R$</span>
              <input type="number" step="0.01" id="valor" placeholder="0,00" required class="w-full bg-slate-950 border border-slate-800 rounded-2xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition font-semibold" />
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- Descrição -->
          <div class="md:col-span-1">
            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wide">Descrição</label>
            <input type="text" id="descricao" placeholder="Ex: Supermercado" required class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" />
          </div>

          <!-- Categoria -->
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wide">Categoria</label>
            <div class="relative">
              <select id="categoria" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white appearance-none focus:outline-none focus:border-blue-500 transition">
                <option value="Alimentação">Alimentação</option>
                <option value="Transporte">Transporte</option>
                <option value="Moradia">Moradia</option>
                <option value="Lazer">Lazer</option>
                <option value="Outros">Outros</option>
              </select>
              <i class="fa-solid fa-chevron-down absolute right-4 top-3.5 text-xs text-slate-500 pointer-events-none"></i>
            </div>
          </div>

          <!-- Data -->
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wide">Data</label>
            <input type="date" id="data-transacao" required class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" />
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-600/30 transition active:scale-[0.99] flex items-center justify-center gap-2 mt-4">
          <i class="fa-solid fa-shield-halved"></i> Adicionar ao Cofre
        </button>
      </form>
    </section>

    <!-- Secção de Extrato do Mês -->
    <section class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-3">
          <div class="bg-indigo-500/10 text-indigo-400 p-2.5 rounded-xl border border-indigo-500/20">
            <i class="fa-solid fa-list text-base"></i>
          </div>
          <div>
            <h2 class="text-lg font-bold text-white">Extrato do Mês</h2>
            <p class="text-xs text-slate-400">Histórico de transações recentes do grupo</p>
          </div>
        </div>
      </div>

      <!-- Lista de Transações (Dinâmica) -->
      <div id="lista-transacoes" class="space-y-3">
        <!-- Exemplo de item bonito -->
        <div class="bg-slate-950 border border-slate-800/80 p-4 rounded-2xl flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="bg-rose-500/10 text-rose-400 p-3 rounded-xl">
              <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <div>
              <p class="text-sm font-bold text-white">Supermercado</p>
              <span class="text-xs text-slate-400">Alimentação • 22/10/2026</span>
            </div>
          </div>
          <span class="text-sm font-black text-rose-400">- R$ 150,00</span>
        </div>
      </div>
    </section>

  </main>

  <script>
    // Definir data atual por defeito no input de data
    document.getElementById('data-transacao').valueAsDate = new Date();

    function sairSistema() {
      localStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
