<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Bolso - Login</title>
    
    <!-- Ícone e Configuração para Telemóvel -->
    <link rel="apple-touch-icon" sizes="180x180" href="icone-app.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icone-app.png">
    
    <!-- Importação de ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .login-card {
            background: #0f1117;
            width: 380px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 14px 14px 28px #08090d, -14px -14px 28px #161921;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            background: #0f1117;
            box-shadow: 6px 6px 12px #08090d, -6px -6px 12px #161921;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo-container img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 18px;
            color: #7b849c;
            font-size: 16px;
        }

        .input-group .toggle-password {
            left: auto;
            right: 18px;
            cursor: pointer;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            background: #0f1117;
            border: none;
            outline: none;
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            box-shadow: inset 4px 4px 8px #08090d, inset -4px -4px 8px #161921;
        }

        .input-group input::placeholder {
            color: #5a637a;
        }

        .btn-entrar {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 4px 4px 10px #08090d, -4px -4px 10px #161921;
            transition: 0.2s ease;
        }

        .btn-entrar:active {
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.4);
        }

        .footer-link {
            margin-top: 30px;
            font-size: 13px;
            color: #7b849c;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: #f39c12;
        }

        #errorMsg {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo / Ícone Superior -->
        <div class="logo-container">
            <i class="fa-solid fa-chart-pie" style="font-size: 28px; color: #00f2fe;"></i>
        </div>

        <!-- Campo E-mail -->
        <div class="input-group">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="E-mail" required>
        </div>

        <!-- Campo Senha -->
        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="Senha" required>
            <i class="fa-regular fa-eye-slash toggle-password" id="toggleEye" onclick="togglePasswordVisibility()"></i>
        </div>

        <!-- Mensagem de Erro -->
        <div id="errorMsg"></div>

        <!-- Botão Entrar -->
        <button class="btn-entrar" onclick="fazerLogin()">ENTRAR</button>

        <!-- Link Criar Conta -->
        <a href="#" onclick="criarConta(event)" class="footer-link">Criar Conta / Solicitar Acesso</a>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
          authDomain: "nosso-bolso-c8d29.firebaseapp.com",
          projectId: "nosso-bolso-c8d29",
          storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
          messagingSenderId: "812166717623",
          appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Função para alternar visibilidade da senha
        function togglePasswordVisibility() {
            const passInput = document.getElementById('loginPassword');
            const eyeIcon = document.getElementById('toggleEye');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'fa-regular fa-eye toggle-password';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'fa-regular fa-eye-slash toggle-password';
            }
        }

        // Função de Login
        async function fazerLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.innerText = '';

            if (!email || !password) {
                errorDiv.innerText = 'Preencha o e-mail e a senha.';
                return;
            }

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Redirecionar dependendo se é admin ou utilizador normal
                if (user.email === 'c.pirespm@gmail.com') {
                    window.location.replace('admin.html');
                } else {
                    window.location.replace('painel.html');
                }
            } catch (err) {
                console.error(err);
                errorDiv.innerText = 'Erro ao entrar: Verifique o seu e-mail e senha.';
            }
        }

        // Função para criar conta (registar novo utilizador pendente)
        async function criarConta(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.innerText = '';

            if (!email || !password) {
                errorDiv.innerText = 'Digite um e-mail e uma senha para se registar.';
                return;
            }

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Criar registo na coleção de utilizadores como pendente
                await db.collection('users').doc(user.uid).set({
                    email: user.email,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('Conta criada com sucesso! O seu acesso está pendente de aprovação pelo administrador.');
                window.location.replace('painel.html');
            } catch (err) {
                console.error(err);
                errorDiv.innerText = 'Erro ao criar conta: ' + err.message;
            }
        }
    </script>
</body>
</html>
