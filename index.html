<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nosso Bolso - Entrar</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    
    /* Fundo escuro imersivo com gradiente */
    .bg-immersive {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
    }

    /* Efeito de Vidro Fosco (Glassmorphism) */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
    }

    .glass-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(245, 158, 11, 0.6);
    }

    /* Botão com degradê dourado elegante */
    .btn-gold {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.4);
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
    }

    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.7; }
    }
    .animate-glow {
      animation: pulse-slow 8s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-immersive text-slate-100 min-h-screen flex items-center justify-center p-4 overflow-hidden relative antialiased">

  <!-- Elementos de luz de fundo -->
  <div class="absolute -top-32 -left-32 w-80 h-80 bg-blue-600/20 rounded-full blur-[100px] pointer-events-none animate-glow"></div>
  <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-amber-500/15 rounded-full blur-[100px] pointer-events-none animate-glow" style="animation-delay: 4s;"></div>

  <div class="w-full max-w-sm glass-card p-8 rounded-[2.5rem] space-y-7 relative z-10">
    
    <!-- Logótipo Dourado Minimalista -->
    <div class="text-center space-y-3 pt-1">
      <div class="w-16 h-16 bg-gradient-to-tr from-amber-500/20 to-amber-300/10 border border-amber-500/30 text-amber-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <h1 class="text-lg font-black tracking-tight text-white">Nosso Bolso</h1>
    </div>

    <!-- Formulário de Login -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      
      <!-- Campo E-mail -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 text-xs">
          <i class="fa-regular fa-envelope"></i>
        </span>
        <input type="email" id="loginEmail" required placeholder="E-mail" class="w-full rounded-2xl glass-input pl-11 pr-4 py-3.5 text-xs font-semibold focus:outline-none transition" />
      </div>

      <!-- Campo Senha -->
      <div class="space-y-1">
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 text-xs">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="loginPassword" required placeholder="Senha" class="w-full rounded-2xl glass-input pl-11 pr-11 py-3.5 text-xs font-semibold focus:outline-none transition" />
          <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-white text-xs">
            <i id="eyeIcon" class="fa-solid fa-eye-slash"></i>
          </button>
        </div>
        <div class="text-right pt-1">
          <a href="#" onclick="alert('Funcionalidade de recuperar senha em breve.')" class="text-[10px] text-slate-400 hover:text-amber-400 transition font-medium">Esqueceu a senha?</a>
        </div>
      </div>

      <div id="loginErrorMsg" class="text-xs font-bold text-rose-300 text-center bg-rose-950/60 p-2.5 rounded-xl border border-rose-800/40 hidden"></div>

      <!-- Botão LOGIN -->
      <button type="submit" id="loginBtn" class="w-full py-3.5 btn-gold rounded-2xl text-xs font-extrabold tracking-widest transition active:scale-95">
        ENTRAR
      </button>
    </form>

    <!-- Criar Conta -->
    <div class="text-center pt-1">
      <button onclick="openRegisterModal()" class="text-xs text-slate-400 hover:text-amber-400 font-medium transition">
        Criar Conta / Solicitar Acesso
      </button>
    </div>
  </div>

  <!-- MODAL DE REGISTO / SOLICITAÇÃO DE ACESSO -->
  <div id="registerModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4 hidden backdrop-blur-md">
    <div class="w-full max-w-sm glass-card p-6 rounded-[2.5rem] space-y-4 border border-white/10">
      <div class="flex items-center justify-between pb-2 border-b border-white/10">
        <h3 class="text-sm font-extrabold text-white">Solicitar Acesso</h3>
        <button onclick="closeRegisterModal()" class="text-slate-400 text-base hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-xs text-slate-400 leading-relaxed">Insira o seu e-mail e crie uma senha. O acesso precisará de aprovação do administrador.</p>
      
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">E-mail</label>
          <input type="email" id="regEmail" required placeholder="seu@email.com" class="w-full rounded-xl glass-input px-3.5 py-3 text-xs font-bold focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Senha (mín. 6 caracteres)</label>
          <input type="password" id="regPassword" required placeholder="••••••••" class="w-full rounded-xl glass-input px-3.5 py-3 text-xs font-bold focus:outline-none" />
        </div>

        <div id="regErrorMsg" class="text-xs font-bold text-rose-300 text-center bg-rose-950/60 p-2 rounded-xl border border-rose-800/40 hidden"></div>

        <button type="submit" class="w-full py-3.5 btn-gold rounded-2xl text-xs font-extrabold tracking-wider transition shadow-md">
          ENVIAR SOLICITAÇÃO
        </button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
      authDomain: "nosso-bolso-c8d29.firebaseapp.com",
      projectId: "nosso-bolso-c8d29",
      storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
      messagingSenderId: "812166717623",
      appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let tentativasFalhadas = 0;
    let bloqueadoAte = 0;

    function togglePassword() {
      const passInput = document.getElementById('loginPassword');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.className = 'fa-solid fa-eye';
      } else {
        passInput.type = 'password';
        eyeIcon.className = 'fa-solid fa-eye-slash';
      }
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        if (user.email === 'c.pirespm@gmail.com') {
          window.location.replace("admin.html");
        } else {
          window.location.replace("painel.html");
        }
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      const agora = Date.now();
      if (agora < bloqueadoAte) {
        const segundosRestantes = Math.ceil((bloqueadoAte - agora) / 1000);
        const errDiv = document.getElementById('loginErrorMsg');
        errDiv.innerText = `Aguarde ${segundosRestantes}s para tentar novamente.`;
        errDiv.classList.remove('hidden');
        return;
      }

      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();
      const errDiv = document.getElementById('loginErrorMsg');
      const btn = document.getElementById('loginBtn');
      errDiv.classList.add('hidden');

      try {
        await auth.signInWithEmailAndPassword(email, pass);
        tentativasFalhadas = 0; 
      } catch (err) {
        tentativasFalhadas++;
        if (tentativasFalhadas >= 3) {
          bloqueadoAte = Date.now() + 30000; 
          errDiv.innerText = "Conta bloqueada por 30 segundos devido a várias tentativas.";
          errDiv.classList.remove('hidden');
          btn.disabled = true;
          btn.classList.add('opacity-50', 'cursor-not-allowed');

          const intervalo = setInterval(() => {
            const resto = Math.ceil((bloqueadoAte - Date.now()) / 1000);
            if (resto <= 0) {
              clearInterval(intervalo);
              btn.disabled = false;
              btn.classList.remove('opacity-50', 'cursor-not-allowed');
              btn.innerText = "ENTRAR";
              errDiv.classList.add('hidden');
              tentativasFalhadas = 0;
            } else {
              btn.innerText = `Aguarde ${resto}s...`;
            }
          }, 1000);
        } else {
          errDiv.innerText = `E-mail ou senha incorretos. Tentativa ${tentativasFalhadas}/3.`;
          errDiv.classList.remove('hidden');
        }
      }
    }

    function openRegisterModal() { document.getElementById('registerModal').classList.remove('hidden'); }
    function closeRegisterModal() { document.getElementById('registerModal').classList.add('hidden'); }

    async function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPassword').value.trim();
      const errDiv = document.getElementById('regErrorMsg');
      errDiv.classList.add('hidden');

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        const uid = cred.user.uid;

        await db.collection('users').doc(uid).set({
          email: email,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await auth.signOut();

        alert("Solicitação enviada com sucesso! Aguarde a aprovação do administrador.");
        closeRegisterModal();
        document.getElementById('registerForm').reset();
      } catch (err) {
        errDiv.innerText = "Erro ao registrar: " + err.message;
        errDiv.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
