<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Bolso - Acesso Seguro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4 font-sans">

  <div class="bg-slate-800 p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-700">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-blue-500 mb-2">Nosso Bolso</h1>
      <p id="form-subtitle" class="text-sm text-slate-400">Faça login para acessar seu controle</p>
    </div>
    
    <form id="auth-form" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1.5">E-mail</label>
        <input type="email" id="email" required class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1.5">Senha</label>
        <input type="password" id="senha" required class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" />
      </div>
      
      <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95">
        Entrar no Sistema
      </button>
    </form>

    <div id="mensagem" class="mt-5 text-sm font-semibold text-center p-3 rounded-xl hidden"></div>

    <div class="mt-6 text-center text-sm text-slate-400">
      <span id="toggle-text">Não tem uma conta?</span> 
      <button type="button" onclick="alternarModo()" id="toggle-btn" class="text-blue-400 font-bold hover:text-blue-300 ml-1">Solicitar Acesso</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
      authDomain: "nosso-bolso-c8d29.firebaseapp.com",
      projectId: "nosso-bolso-c8d29",
      storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
      messagingSenderId: "812166717623",
      appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    let modoCadastro = false;

    function alternarModo() {
      modoCadastro = !modoCadastro;
      document.getElementById('form-subtitle').innerText = modoCadastro ? "Crie sua conta para solicitar acesso" : "Faça login para acessar seu controle";
      document.getElementById('submit-btn').innerText = modoCadastro ? "Solicitar Acesso" : "Entrar no Sistema";
      document.getElementById('toggle-text').innerText = modoCadastro ? "Já possui acesso?" : "Não tem uma conta?";
      document.getElementById('toggle-btn').innerText = modoCadastro ? "Fazer Login" : "Solicitar Acesso";
      document.getElementById('mensagem').classList.add('hidden');
    }

    function mostrarMensagem(texto, tipo) {
      const div = document.getElementById('mensagem');
      div.className = `mt-5 text-sm font-semibold text-center p-3 rounded-xl block border ${
        tipo === 'sucesso' ? 'bg-emerald-900/30 text-emerald-400 border-emerald-800' :
        tipo === 'erro' ? 'bg-rose-900/30 text-rose-400 border-rose-800' :
        'bg-blue-900/30 text-blue-400 border-blue-800'
      }`;
      div.innerHTML = texto;
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();
      mostrarMensagem("Aguarde...", "info");

      try {
        let userCred;
        if (modoCadastro) {
          userCred = await auth.createUserWithEmailAndPassword(email, senha);
        } else {
          userCred = await auth.signInWithEmailAndPassword(email, senha);
        }

        const token = await userCred.user.getIdToken();
        
        // Pede a validação ao servidor (Netlify Functions)
        const response = await fetch('/.netlify/functions/auth', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          mostrarMensagem(data.message || "Acesso autorizado!", "sucesso");
          
          // Redirecionamento inteligente: Admin vai direto para gestão, Membros vão para o painel de gastos
          setTimeout(() => {
            if (email === 'c.pirespm@gmail.com' || data.isAdmin) {
              window.location.href = "admin.html";
            } else {
              window.location.href = "painel.html";
            }
          }, 1500);
        } else {
          await auth.signOut(); // Desliga a sessão se o servidor barrar
          mostrarMensagem(data.error || "Acesso bloqueado.", "erro");
        }
      } catch (error) {
        let msg = "Ocorreu um erro. Verifique seus dados.";
        if (error.code === 'auth/email-already-in-use') msg = "Este e-mail já está cadastrado.";
        if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') msg = "E-mail ou senha incorretos.";
        if (error.code === 'auth/weak-password') msg = "A senha deve ter pelo menos 6 caracteres.";
        mostrarMensagem(msg, "erro");
      }
    });
  </script>
</body>
</html>
