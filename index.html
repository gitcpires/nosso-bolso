<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Bolso - Acesso Seguro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#E4F2FD] text-slate-800 flex items-center justify-center min-h-screen p-4 antialiased relative overflow-x-hidden">

  <!-- Elemento decorativo de fundo suave idêntico ao modelo -->
  <div class="absolute top-10 left-10 w-64 h-64 bg-white/40 rounded-full blur-2xl pointer-events-none"></div>

  <!-- Card Principal Único (Seguindo rigorosamente o modelo da imagem enviada) -->
  <div class="w-full max-w-sm bg-white p-6 sm:p-7 rounded-[2.5rem] shadow-xl border border-blue-100 flex flex-col justify-between relative">
    
    <!-- Topo com Voltar / Elementos -->
    <div class="flex items-center justify-between mb-4">
      <div class="h-8 w-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 cursor-pointer">
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </div>
      <div class="text-[10px] font-extrabold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">Nosso Bolso</div>
    </div>

    <!-- Título Principal -->
    <div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Wellcome</h1>
      <p class="text-xs text-slate-400 font-medium mt-0.5">Here you log in securely</p>
    </div>

    <!-- Ilustração Centralizada: Casal no Sofá com Elementos de Finanças (No mesmo estilo leve e limpo) -->
    <div class="my-5 bg-[#F4F9FF] rounded-3xl p-4 border border-blue-50 relative flex flex-col items-center justify-center">
      <div class="absolute top-3 left-3 text-[9px] font-extrabold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">Finanças a Dois</div>
      <div class="absolute top-3 right-3 text-[9px] font-extrabold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">R$ ✓</div>
      
      <!-- Representação gráfica minimalista do casal no sofá -->
      <div class="py-4 flex items-center justify-center gap-2 text-slate-700">
        <div class="flex items-center gap-1 bg-white px-3 py-2 rounded-2xl shadow-2xs border border-blue-100">
          <i class="fa-solid fa-user text-blue-600 text-xs"></i>
          <i class="fa-solid fa-user text-indigo-500 text-xs"></i>
          <span class="text-[11px] font-bold text-slate-700 ml-1">Casal no Sofá</span>
        </div>
      </div>
      <div class="text-[10px] text-slate-400 text-center font-medium">Controlando as despesas domésticas juntos</div>
    </div>

    <!-- Formulário Dinâmico / Alternável (Login ou Cadastro) -->
    <form id="auth-form" class="space-y-3">
      <div>
        <label id="labelEmail" class="block text-[11px] font-extrabold text-slate-500 mb-1">Email</label>
        <input type="email" id="email" required placeholder="seu@email.com" class="w-full rounded-2xl bg-slate-50 border border-slate-200 px-3.5 py-2.5 text-xs font-semibold text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white transition" />
      </div>
      <div>
        <label id="labelSenha" class="block text-[11px] font-extrabold text-slate-500 mb-1">Password</label>
        <input type="password" id="senha" required placeholder="••••••••" class="w-full rounded-2xl bg-slate-50 border border-slate-200 px-3.5 py-2.5 text-xs font-semibold text-slate-800 focus:outline-none focus:border-blue-600 focus:bg-white transition" />
      </div>

      <!-- Mensagens de feedback -->
      <div id="mensagem" class="text-xs font-semibold text-center p-2.5 rounded-2xl hidden"></div>

      <!-- Botões de Ação idênticos ao modelo (Log in / Sign Up) -->
      <div class="space-y-2 pt-2">
        <button type="submit" id="mainSubmitBtn" class="w-full py-3 px-4 rounded-2xl border-2 border-slate-900 bg-slate-900 text-white font-extrabold text-xs shadow-md hover:bg-slate-800 transition active:scale-95 text-center">
          Log in
        </button>
        <button type="button" id="secondaryToggleBtn" onclick="alternarModoVisual()" class="w-full py-3 px-4 rounded-2xl border-2 border-blue-200 bg-blue-50 text-blue-700 font-extrabold text-xs hover:bg-blue-100 transition active:scale-95 text-center">
          Sign Up
        </button>
      </div>
    </form>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
      authDomain: "nosso-bolso-c8d29.firebaseapp.com",
      projectId: "nosso-bolso-c8d29",
      storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
      messagingSenderId: "812166717623",
      appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    let modoCadastro = false;

    function alternarModoVisual() {
      modoCadastro = !modoCadastro;
      const mainBtn = document.getElementById('mainSubmitBtn');
      const secondBtn = document.getElementById('secondaryToggleBtn');
      
      if (modoCadastro) {
        mainBtn.innerText = "Criar Conta (Sign Up)";
        mainBtn.className = "w-full py-3 px-4 rounded-2xl border-2 border-blue-600 bg-blue-600 text-white font-extrabold text-xs shadow-md hover:bg-blue-700 transition active:scale-95 text-center";
        secondBtn.innerText = "Já tem uma conta? Faça Login";
      } else {
        mainBtn.innerText = "Log in";
        mainBtn.className = "w-full py-3 px-4 rounded-2xl border-2 border-slate-900 bg-slate-900 text-white font-extrabold text-xs shadow-md hover:bg-slate-800 transition active:scale-95 text-center";
        secondBtn.innerText = "Sign Up";
      }
      document.getElementById('mensagem').classList.add('hidden');
    }

    function mostrarMensagem(texto, tipo) {
      const div = document.getElementById('mensagem');
      div.className = `text-xs font-semibold text-center p-2.5 rounded-2xl block border ${
        tipo === 'sucesso' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
        tipo === 'erro' ? 'bg-rose-50 text-rose-700 border-rose-200' :
        'bg-blue-50 text-blue-700 border-blue-200'
      }`;
      div.innerHTML = texto;
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();
      mostrarMensagem("Aguarde...", "info");

      try {
        let userCred;
        if (modoCadastro) {
          userCred = await auth.createUserWithEmailAndPassword(email, senha);
        } else {
          userCred = await auth.signInWithEmailAndPassword(email, senha);
        }

        const token = await userCred.user.getIdToken();
        const response = await fetch('/.netlify/functions/auth', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          mostrarMensagem(data.message || "Acesso autorizado!", "sucesso");
          setTimeout(() => {
            if (email === 'c.pirespm@gmail.com' || data.isAdmin) {
              window.location.href = "admin.html";
            } else {
              window.location.href = "painel.html";
            }
          }, 1200);
        } else {
          await auth.signOut();
          mostrarMensagem(data.error || "Acesso bloqueado.", "erro");
        }
      } catch (error) {
        let msg = "Ocorreu um erro. Verifique seus dados.";
        if (error.code === 'auth/email-already-in-use') msg = "Este e-mail já está cadastrado.";
        if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') msg = "E-mail ou senha incorretos.";
        if (error.code === 'auth/weak-password') msg = "A senha deve ter pelo menos 6 caracteres.";
        mostrarMensagem(msg, "erro");
      }
    });
  </script>
</body>
</html>
