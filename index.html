<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Bolso - Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen px-4">

  <div class="w-full max-w-sm bg-slate-900/80 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
    
    <!-- Ícone / Logótipo Central (Aponta corretamente para o teu icone-app.png) -->
    <div class="text-center space-y-3">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-slate-800/80 border border-slate-700 shadow-inner overflow-hidden p-2">
        <img src="icone-app.png" alt="Nosso Bolso" class="w-full h-full object-contain rounded-xl" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
      </div>
    </div>

    <form onsubmit="fazerLogin(event)" class="space-y-4">
      <!-- Campo E-mail com ícone -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
          <i class="fa-solid fa-envelope text-xs"></i>
        </span>
        <input type="email" id="loginEmail" required class="w-full bg-slate-950/60 border border-slate-800 rounded-2xl pl-10 pr-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition" placeholder="E-mail">
      </div>

      <!-- Campo Senha com ícone e botão de mostrar/ocultar -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
          <i class="fa-solid fa-lock text-xs"></i>
        </span>
        <input type="password" id="loginPassword" required class="w-full bg-slate-950/60 border border-slate-800 rounded-2xl pl-10 pr-10 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition" placeholder="Senha">
        <button type="button" onclick="toggleSenha()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-white transition">
          <i id="eyeIcon" class="fa-solid fa-eye-slash text-xs"></i>
        </button>
      </div>

      <div id="msgFeedback" class="text-xs font-bold text-rose-500 text-center hidden"></div>

      <!-- Botão Entrar Laranja -->
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs py-3.5 rounded-2xl transition shadow-lg shadow-amber-500/20 uppercase tracking-wider">
        Entrar
      </button>
    </form>

    <!-- Link Criar Conta / Solicitar Acesso -->
    <div class="text-center pt-2">
      <a href="#" onclick="alert('Para solicitar acesso, entre em contacto com o administrador.')" class="text-[11px] text-slate-400 hover:text-amber-400 transition">
        Criar Conta / Solicitar Acesso
      </a>
    </div>

  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
      authDomain: "nosso-bolso-c8d29.firebaseapp.com",
      projectId: "nosso-bolso-c8d29",
      storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
      messagingSenderId: "812166717623",
      appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function toggleSenha() {
      const input = document.getElementById('loginPassword');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      }
    }

    async function fazerLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const feedback = document.getElementById('msgFeedback');
      feedback.classList.add('hidden');
      feedback.innerText = '';

      if (!email || !password) {
        feedback.innerText = 'Preencha o e-mail e a senha.';
        feedback.classList.remove('hidden');
        return;
      }

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        const adminDoc = await db.collection('ADMIN_UID').doc(user.uid).get();

        if (adminDoc.exists) {
            window.location.replace('admin.html');
        } else {
            window.location.replace('painel.html');
        }
      } catch (err) {
        console.error(err);
        feedback.innerText = 'Erro ao entrar: Verifique seu e-mail e senha.';
        feedback.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
