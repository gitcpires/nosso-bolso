<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Bolso - Entrar</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#0b132b] p-8 rounded-3xl border border-slate-800 shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600/10 text-blue-500 text-2xl font-black mb-2">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <h1 class="text-2xl font-black text-white">Nosso Bolso</h1>
      <p class="text-xs text-slate-400">Controlo financeiro partilhado</p>
    </div>

    <!-- Formulário de Autenticação -->
    <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
      <div>
        <label class="block text-[11px] font-bold text-slate-400 mb-1">E-mail</label>
        <input type="email" id="authEmail" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-[11px] font-bold text-slate-400 mb-1">Palavra-passe</label>
        <input type="password" id="authPassword" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
      </div>

      <div id="authErrorMsg" class="hidden text-xs text-rose-500 font-bold bg-rose-500/1 p-2.5 rounded-xl border border-rose-500/20 text-center"></div>

      <button type="submit" id="btnSubmitAuth" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs py-3 rounded-xl transition shadow-lg shadow-blue-600/20 active:scale-95">
        Entrar / Registar
      </button>
    </form>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="auth.js"></script>
</body>
</html>
