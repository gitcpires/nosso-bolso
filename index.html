<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Bolso - Acesso</title>
    
    <!-- Ícone e Configuração para Telemóvel -->
    <link rel="apple-touch-icon" sizes="180x180" href="icone-app.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icone-app.png">
    
    <!-- Importação de ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1117;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .login-card {
            background: #0f1117;
            width: 380px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 14px 14px 28px #08090d, -14px -14px 28px #161921;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            background: #0f1117;
            box-shadow: 6px 6px 12px #08090d, -6px -6px 12px #161921;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .logo-container img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 10px;
        }

        h2 {
            font-size: 16px;
            color: #a0aec0;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 18px;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 18px;
            color: #7b849c;
            font-size: 16px;
        }

        .input-group .toggle-password {
            left: auto;
            right: 18px;
            cursor: pointer;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            background: #0f1117;
            border: none;
            outline: none;
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            box-shadow: inset 4px 4px 8px #08090d, inset -4px -4px 8px #161921;
        }

        .input-group input::placeholder {
            color: #5a637a;
        }

        .btn-acao {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 4px 4px 10px #08090d, -4px -4px 10px #161921;
            transition: 0.2s ease;
        }

        .btn-acao:active {
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.4);
        }

        .footer-link {
            margin-top: 25px;
            font-size: 13px;
            color: #7b849c;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
            text-align: center;
        }

        .footer-link:hover {
            color: #f39c12;
        }

        #msgFeedback {
            font-size: 12px;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo Personalizado do App -->
        <div class="logo-container">
            <img src="icone-app.png" alt="Nosso Bolso">
        </div>

        <h2 id="formTitle">ENTRAR NO SISTEMA</h2>

        <!-- FORMULÁRIO DE LOGIN -->
        <div id="loginFormSection" style="width: 100%;">
            <div class="input-group">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="E-mail">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="Senha">
                <i class="fa-regular fa-eye-slash toggle-password" id="toggleEyeLogin" onclick="togglePass('loginPassword', 'toggleEyeLogin')"></i>
            </div>

            <button class="btn-acao" onclick="fazerLogin()">ENTRAR</button>
            <a onclick="alternarFormulario('register')" class="footer-link" style="display: block;">Criar Conta / Solicitar Acesso</a>
        </div>

        <!-- FORMULÁRIO DE REGISTO (Inicialmente oculto) -->
        <div id="registerFormSection" style="width: 100%; display: none;">
            <div class="input-group">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="regEmail" placeholder="Seu E-mail">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="regPassword" placeholder="Criar Senha">
                <i class="fa-regular fa-eye-slash toggle-password" id="toggleEyeReg" onclick="togglePass('regPassword', 'toggleEyeReg')"></i>
            </div>

            <button class="btn-acao" onclick="registarConta()">REGISTAR CONTA</button>
            <a onclick="alternarFormulario('login')" class="footer-link" style="display: block;">Já tens conta? Entrar</a>
        </div>

        <!-- Mensagens de Erro ou Sucesso -->
        <div id="msgFeedback"></div>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
          authDomain: "nosso-bolso-c8d29.firebaseapp.com",
          projectId: "nosso-bolso-c8d29",
          storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
          messagingSenderId: "812166717623",
          appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Alternar entre formulários de Login e Registo
        function alternarFormulario(tipo) {
            const loginSec = document.getElementById('loginFormSection');
            const regSec = document.getElementById('registerFormSection');
            const title = document.getElementById('formTitle');
            document.getElementById('msgFeedback').innerText = '';

            if (tipo === 'register') {
                loginSec.style.display = 'none';
                regSec.style.display = 'block';
                title.innerText = 'CRIAR NOVA CONTA';
            } else {
                regSec.style.display = 'none';
                loginSec.style.display = 'block';
                title.innerText = 'ENTRAR NO SISTEMA';
            }
        }

        // Função para alternar visibilidade da senha
        function togglePass(inputId, iconId) {
            const passInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'fa-regular fa-eye toggle-password';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'fa-regular fa-eye-slash toggle-password';
            }
        }

        // Função de Login
        async function fazerLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const feedback = document.getElementById('msgFeedback');
            feedback.style.color = '#e74c3c';
            feedback.innerText = '';

            if (!email || !password) {
                feedback.innerText = 'Preencha o e-mail e a senha.';
                return;
            }

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                if (user.email === 'c.pirespm@gmail.com') {
                    window.location.replace('admin.html');
                } else {
                    window.location.replace('painel.html');
                }
            } catch (err) {
                console.error(err);
                feedback.innerText = 'Erro ao entrar: Verifique o seu e-mail e senha.';
            }
        }

        // Função para Criar Conta
        async function registarConta() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const feedback = document.getElementById('msgFeedback');
            feedback.innerText = '';

            if (!email || !password) {
                feedback.style.color = '#e74c3c';
                feedback.innerText = 'Preencha todos os campos para se registar.';
                return;
            }

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Registar na base de dados com o status pendente para aprovação do admin
                await db.collection('users').doc(user.uid).set({
                    email: user.email,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                feedback.style.color = '#2ecc71';
                feedback.innerText = 'Conta criada com sucesso! Redirecionando...';
                
                setTimeout(() => {
                    window.location.replace('painel.html');
                }, 1500);

            } catch (err) {
                console.error(err);
                feedback.style.color = '#e74c3c';
                feedback.innerText = 'Erro ao registar: ' + err.message;
            }
        }
    </script>
</body>
</html>
