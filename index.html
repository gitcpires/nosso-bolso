<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Segurança - Nosso Bolso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4 font-sans">

  <div class="bg-slate-800 p-6 rounded-3xl shadow-xl w-full max-w-sm border border-slate-700">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-black text-white">Teste do Servidor</h2>
      <p class="text-xs text-slate-400 mt-1">Validação de Comunicação Segura</p>
    </div>
    
    <form id="loginForm" onsubmit="testarLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1.5">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1.5">Senha</label>
        <input type="password" id="senha" required placeholder="••••••••" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition" />
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition active:scale-95">
        Testar Conexão com Netlify
      </button>
    </form>

    <div id="resultado" class="mt-5 text-xs font-semibold text-center p-3 rounded-xl hidden"></div>
  </div>

  <script>
    // Suas credenciais originais do projeto
    const firebaseConfig = {
      apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
      authDomain: "nosso-bolso-c8d29.firebaseapp.com",
      projectId: "nosso-bolso-c8d29",
      storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
      messagingSenderId: "812166717623",
      appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    async function testarLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value.trim();
      const resultDiv = document.getElementById('resultado');

      resultDiv.className = "mt-5 text-xs font-semibold text-center p-3 rounded-xl bg-blue-900/30 text-blue-400 border border-blue-800 block";
      resultDiv.innerText = "1. Validando credenciais no Firebase...";

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, senha);
        const token = await userCredential.user.getIdToken();

        resultDiv.innerText = "2. Firebase OK! Enviando token para o Netlify...";

        const response = await fetch('/.netlify/functions/auth', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const data = await response.json();

        if (response.ok && data.ok) {
          resultDiv.className = "mt-5 text-xs font-semibold text-center p-3 rounded-xl bg-emerald-900/30 text-emerald-400 border border-emerald-800 block";
          resultDiv.innerHTML = `<b>SUCESSO!</b><br>${data.mensagem}<br><span class="text-[10px] text-emerald-600">Sua conta: ${data.email}</span>`;
        } else {
          resultDiv.className = "mt-5 text-xs font-semibold text-center p-3 rounded-xl bg-rose-900/30 text-rose-400 border border-rose-800 block";
          resultDiv.innerText = "ERRO DO SERVIDOR: " + (data.error || "Desconhecido");
        }

      } catch (error) {
        resultDiv.className = "mt-5 text-xs font-semibold text-center p-3 rounded-xl bg-rose-900/30 text-rose-400 border border-rose-800 block";
        resultDiv.innerText = "ERRO DE LOGIN: " + error.message;
      }
    }
  </script>
</body>
</html>
