<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Bolso - Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen px-4">

  <div class="w-full max-w-sm bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl space-y-6">
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-black tracking-tight text-white"><i class="fa-solid fa-wallet text-blue-500 mr-2"></i>Nosso Bolso</h1>
      <p class="text-xs text-slate-400">Acesse sua conta para continuar</p>
    </div>

    <form onsubmit="fazerLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">E-mail</label>
        <input type="email" id="loginEmail" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500 transition" placeholder="seu@email.com">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Senha</label>
        <input type="password" id="loginPassword" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500 transition" placeholder="••••••••">
      </div>

      <div id="msgFeedback" class="text-xs font-bold text-rose-500 text-center hidden"></div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs py-3 rounded-xl transition shadow-lg shadow-blue-600/30">
        Entrar
      </button>
    </form>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMR6Aq9KoDGPkZLZueBgIo7AhNx5Gj08Q",
      authDomain: "nosso-bolso-c8d29.firebaseapp.com",
      projectId: "nosso-bolso-c8d29",
      storageBucket: "nosso-bolso-c8d29.firebasestorage.app",
      messagingSenderId: "812166717623",
      appId: "1:812166717623:web:ba3a4c0db18484be47ad32"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    async function fazerLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const feedback = document.getElementById('msgFeedback');
      feedback.classList.add('hidden');
      feedback.innerText = '';

      if (!email || !password) {
        feedback.innerText = 'Preencha o e-mail e a senha.';
        feedback.classList.remove('hidden');
        return;
      }

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Verificação segura na coleção ADMIN_UID do Firestore
        const adminDoc = await db.collection('ADMIN_UID').doc(user.uid).get();

        if (adminDoc.exists) {
            window.location.replace('admin.html');
        } else {
            window.location.replace('painel.html');
        }
      } catch (err) {
        console.error(err);
        feedback.innerText = 'Erro ao entrar: Verifique seu e-mail e senha.';
        feedback.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
